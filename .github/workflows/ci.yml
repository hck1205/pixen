name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No version pin here: package.json's packageManager field is the single
      # source of truth, and specifying both makes the action fail outright.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Independence scan
        run: pnpm check:independence

      - name: Unused-export scan
        run: pnpm check:exports

      # The two halves of "refactor continuously" that a person was doing by
      # reading: the third copy of a block, and a file that has grown past the
      # size where it owes an explanation.
      - name: Duplicate-block scan
        run: pnpm check:duplication

      - name: Module-size budget
        run: pnpm check:size

      # The published API, against the file that records it: a name added by a
      # starred barrel reaches every host that upgrades, and used to reach
      # nobody's review.
      - name: Public-surface scan
        run: pnpm check:surface

      - name: Build packages
        run: pnpm build

      # The apps are not part of the package build, so they need saying: a type
      # error in the playground or the stories used to reach nobody.
      - name: Typecheck everything, apps included
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build stories
        run: pnpm stories:build

      # No `--with-deps`. That flag runs `apt-get update` before installing, and
      # on this runner the Ubuntu mirror has twice stopped answering — the job
      # sat silent for nineteen minutes and was killed by the timeout, which
      # reads as "cancelled" and looks like a person did it.
      #
      # It was buying fonts, not libraries: on a green run the only packages it
      # installed were CJK, Thai and Cyrillic font sets, so the shared objects
      # Chromium needs are already in the image. Those fonts matter to golden
      # images, and the visual suite that takes them is opt-in and never runs
      # here — see docs/TESTING.md. If a future image really is missing a
      # library, `pnpm test:browser` fails on the first launch and names it.
      - name: Install Chromium
        run: pnpm exec playwright install chromium
        # A download, not a package manager: healthy is under a minute. Bounded
        # so a stalled CDN fails here, quickly and by name, instead of eating
        # the job's whole budget.
        timeout-minutes: 6

      # `test:browser` builds the packages and the playground it tests, so the
      # suite can never run against a stale bundle.
      - name: Browser tests
        run: pnpm test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
