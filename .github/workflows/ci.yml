name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # No version pin here: package.json's packageManager field is the single
      # source of truth, and specifying both makes the action fail outright.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Independence scan
        run: pnpm check:independence

      - name: Unused-export scan
        run: pnpm check:exports

      - name: Build packages
        run: pnpm build

      # The apps are not part of the package build, so they need saying: a type
      # error in the playground or the stories used to reach nobody.
      - name: Typecheck everything, apps included
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build stories
        run: pnpm stories:build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # `test:browser` builds the packages and the playground it tests, so the
      # suite can never run against a stale bundle.
      - name: Browser tests
        run: pnpm test:browser

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
